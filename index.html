<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40 Hari Alm. Wili Arifin, S.Pd</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Mengatur latar belakang halaman dari URL GIF */
            background-image: url('https://i.makeagif.com/media/3-27-2017/tuVsBH.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Memosisikan konten tepat di tengah layar */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            background-color: rgba;
            backdrop-filter: blur(0px);
            padding: 20px;
            border-radius: px;
            box-shadow:rgba;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .card a {
            text-decoration: none;
            color: #1a73e8;
            display: block;
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .card a:hover img {
            transform: scale(1.02);
        }

        .link-text {
            font-size: 16px;
            font-weight: bold;
            word-break: break-all;
        }

        .card a:hover .link-text {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ganti href dengan URL tujuan yang Anda inginkan -->
        <a href="https://script.google.com/a/macros/guru.sd.belajar.id/s/AKfycbz9RqzHGqZ4JnCV3MnOmW9_KPhTjKTGfnx_SFWuAKjdBrlmkebJDE1ipDh9cF4vtYvqYQ/exec" target="_blank" rel="noopener noreferrer">
            <!-- Ganti src dengan nama file gambar lokal Anda (misal: awan.jpg) atau URL gambar -->
            <img src="https://i.imgur.com/iEjyHYG.png" alt="Pemandangan Awan di Langit">
            <span class="link-text">Buka Link</span>
        </a>
    </div>

</body>
</html>
